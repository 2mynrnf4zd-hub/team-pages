<title>B14U Elite · Coaches</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #f2f4f8; --surface: #ffffff; --ink: #141a29; --muted: #5a6377; --line: #dde2eb;
  --accent: #1f4fd1; --gold: #f2b705; --gold-ink: #3a2b00; --chip: #fff3cc; --chip-ink: #6b4d00; --red: #c62828; --red-bg: #fdecea;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Inter", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1220; --surface: #161d2e; --ink: #edf0f6; --muted: #9aa4b8; --line: #27304a;
  --accent: #7ea2ff; --gold: #f2c23a; --gold-ink: #241a00; --chip: #3a2f10; --chip-ink: #f5d27a; --red: #ff7a70; --red-bg: #3a1714; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1220; --surface: #161d2e; --ink: #edf0f6; --muted: #9aa4b8; --line: #27304a;
  --accent: #7ea2ff; --gold: #f2c23a; --gold-ink: #241a00; --chip: #3a2f10; --chip-ink: #f5d27a; --red: #ff7a70; --red-bg: #3a1714; color-scheme: dark; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
*, *::before, *::after { box-sizing: border-box; }
.wrap { max-width: 920px; margin: 0 auto; padding-block: 28px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header { display: grid; gap: 6px; padding-bottom: 18px; border-bottom: 3px solid var(--gold); }
.kicker { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(34px, 7vw, 54px); line-height: 1; margin: 0; letter-spacing: .01em; }
.card { margin-top: 20px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.card-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.card h2 { font-family: var(--display); font-weight: 600; font-size: 22px; letter-spacing: .03em; text-transform: uppercase; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.rows { list-style: none; margin: 0; padding: 0; }
.rows > li { display: grid; grid-template-columns: 118px minmax(0, 1fr) 92px; gap: 6px 16px; padding: 11px 0; border-top: 1px solid var(--line); align-items: center; }
.rows > li:first-child { border-top: none; }
.date { font-family: var(--display); font-weight: 700; font-size: 19px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.date .days { display: block; font-family: var(--body); font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.name { font-weight: 600; }
.t { display: flex; gap: 12px; align-items: flex-start; min-width: 0; }
.ticon { flex: none; width: 34px; height: 34px; object-fit: contain; border-radius: 6px; background: #fff; }
.ticon.emoji { background: transparent; font-size: 22px; line-height: 34px; text-align: center; }
.who { margin-top: 2px; color: var(--red); font-weight: 500; }
.who.none { color: var(--muted); font-weight: 400; }
.count { justify-self: end; display: grid; justify-items: center; min-width: 76px; padding: 4px 8px; border-radius: 10px; background: var(--red-bg); color: var(--red); }
.count b { font-family: var(--display); font-size: 28px; line-height: 1; font-variant-numeric: tabular-nums; }
.count span { font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.count.zero { background: var(--bg); color: var(--muted); }
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--chip-ink); margin-left: 6px; }
.todo > li { grid-template-columns: minmax(0, 1fr) minmax(0, 220px); }
.todo .due { font-weight: 600; font-size: 14px; }
.todo a { display: block; color: var(--accent); font-weight: 600; text-decoration: none; }
.btn { font: inherit; font-size: 14px; font-weight: 600; border-radius: 999px; padding: 6px 14px; cursor: pointer;
  border: 1.5px solid var(--accent); background: transparent; color: var(--accent); }
.btn.primary, .btn:hover { background: var(--accent); color: var(--surface); }
.btn:focus-visible, .form input:focus-visible, .form textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.form { display: grid; gap: 10px; margin-top: 10px; padding: 14px; border-radius: 10px; background: var(--bg); }
.form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.form label { display: grid; gap: 3px; font-size: 13px; font-weight: 600; color: var(--muted); }
.form input, .form textarea { font: inherit; font-size: 15px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); min-width: 0; width: 100%; }
.form .buttons { display: flex; gap: 8px; }
.form .hint { margin: 0; font-size: 12.5px; color: var(--muted); }
footer { margin-top: 30px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
footer p { margin: 0 0 6px; max-width: 70ch; }
.locked { margin-top: 40px; max-width: 52ch; }
/* The section links stay at the top while scrolling (Josh, 11/23/2026). */
.jump { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 0;
  background: var(--bg); border-bottom: 1px solid var(--line); }
.card h2 { scroll-margin-top: 76px; }
.unmatched-h { margin: 14px 0 4px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.jump button { font: inherit; font-size: 13.5px; font-weight: 600; padding: 4px 12px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface); color: var(--accent); }
.jump button:hover { border-color: var(--accent); }
.contacts { width: 100%; border-collapse: collapse; font-size: 14px; }
.contacts th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 4px 10px 6px 0; }
.contacts td { vertical-align: top; padding: 9px 10px 9px 0; border-top: 1px solid var(--line); }
.contacts .nick { color: var(--muted); font-weight: 500; }
.contacts .line { min-height: 1.5em; }
.contacts a { color: var(--accent); text-decoration: none; white-space: nowrap; }
.staff { margin-top: 12px; display: grid; gap: 4px; font-size: 14px; }
.staff a { color: var(--accent); text-decoration: none; }
@media (max-width: 640px) {
  .rows > li { grid-template-columns: minmax(0, 1fr) 76px; }
  .rows > li .date { grid-column: 1 / -1; }
  .todo > li { grid-template-columns: 1fr; }
  .form .two { grid-template-columns: 1fr; }
}

(async () => {
  const locked = document.getElementById("locked");
  try {
    const k = new URLSearchParams(location.hash.slice(1)).get("k") || "";
    if (!/^[0-9a-f]{64}$/.test(k)) throw new Error("no key");
    const bytes = (h) => Uint8Array.from(h.match(/../g), (x) => parseInt(x, 16));
    const raw = Uint8Array.from(atob(DATA), (c) => c.charCodeAt(0));
    const key = await crypto.subtle.importKey("raw", bytes(k), "AES-CBC", false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-CBC", iv: raw.slice(0, 16) }, key, raw.slice(16));
    const p = JSON.parse(new TextDecoder().decode(plain));
    document.getElementById("page").innerHTML = p.html;
    setUp(p);
  } catch (e) {
    locked.textContent = "This page needs the full link the team parent sent (it ends with #k=…). Open that link again, or ask for it.";
  }
})();

// The links at the top scroll instead of changing the address, which would drop the #k=… key from it.
document.addEventListener("click", (ev) => {
  const b = ev.target.closest("[data-jump]");
  if (b) document.getElementById(b.dataset.jump)?.scrollIntoView({ behavior: "smooth", block: "start" });
});

// "+ New to-do": a short form, then the coach's own email app with the message written. VB Stats reads it (by the
// "[team page]" tag and the page's key line) and adds the to-do to the parents' page.
function setUp(p) {
  const open = document.getElementById("todo-add");
  if (!open || !p.to || !p.token) return;
  open.addEventListener("click", () => {
    if (document.getElementById("todo-form")) return;
    const f = document.createElement("form");
    f.id = "todo-form"; f.className = "form";
    f.innerHTML = '<label>To-do<input name="what" required maxlength="80" autocomplete="off" placeholder="e.g. Pay the January tournament fee"></label>'
      + '<label>Details<textarea name="detail" rows="3" maxlength="500" placeholder="What families need to do"></textarea></label>'
      + '<div class="two"><label>Due<input name="due" type="date"></label>'
      + '<label>Link (optional)<input name="url" type="url" placeholder="https://…" autocomplete="off"></label></div>'
      + '<div class="buttons"><button type="submit" class="btn primary">Write the email</button><button type="button" class="btn cancel">Cancel</button></div>'
      + '<p class="hint">Your email app opens with the message written; tap Send. The to-do shows on the parents\' page (and here) within about 10 minutes.</p>';
    f.querySelector(".cancel").addEventListener("click", () => f.remove());
    f.addEventListener("submit", (e) => {
      e.preventDefault();
      const one = (s) => s.replace(/\s+/g, " ").trim();
      const title = one(f.elements.what.value), detail = one(f.elements.detail.value), url = f.elements.url.value.trim();
      if (!title) return;
      const subject = "New to-do: " + title + " (" + p.team + ") [team page]";
      const body = "Title: " + title + "\nDue: " + (f.elements.due.value || "") + "\nLink: " + (url.startsWith("https://") ? url : "")
        + "\nDetails: " + detail + "\nCoach key: " + p.token + "\n\nSent from the " + p.team + " coaches' page.\n";
      window.location.href = "mailto:" + p.to + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
      f.querySelector(".hint").textContent = "If no email opened, send this to " + p.to + " with the subject “" + subject + "” and keep the lines in the message.";
    });
    open.closest(".card").appendChild(f);
    f.elements.what.focus();
  });
}
</script>
